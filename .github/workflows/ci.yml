name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 27.1–27.2.1 reject the certificate chain builds.hex.pm serves
          # (key_usage_mismatch), which fails rebar installation inside
          # setup-beam before any project step runs. Fixed in 27.2.2; this line
          # resolves to the latest 27.3.x, so do not narrow it back.
          - elixir: "1.18.6"
            otp: "27.3"
          - elixir: "1.20.5"
            otp: "29.1"
    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache Dialyzer PLTs
        uses: actions/cache@v6
        with:
          path: priv/plts
          key: plts-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run the quality gate
        if: matrix.elixir == '1.20.5'
        run: mix ci

      # The formatter reflows between Elixir releases, so the format check is a
      # property of the newest toolchain; the older one still compiles, tests and
      # passes every other gate.
      - name: Run the quality gate without the format check
        if: matrix.elixir != '1.20.5'
        run: mix ci.compat

      - name: Build the docs
        run: MIX_ENV=dev mix docs --warnings-as-errors

      # `--export-coverage` turns off the summary the gate above relies on, so the
      # export is its own run rather than part of `mix ci`.
      - name: Export coverage as lcov
        if: matrix.elixir == '1.20.5'
        run: |
          mix test --cover --export-coverage default
          env MIX_ENV=test mix run --no-start scripts/cover_to_lcov.exs

      - name: Upload coverage to Codecov
        if: matrix.elixir == '1.20.5'
        uses: codecov/codecov-action@v7
        with:
          files: cover/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage
        if: matrix.elixir == '1.20.5'
        uses: actions/upload-artifact@v7
        with:
          name: cover
          path: cover/
          if-no-files-found: ignore
